; Límites de PHP para el formulario (docs/formulario.md). Verificar en cdmon: puede que estos
; valores se configuren desde el panel y este archivo no tenga efecto.
upload_max_filesize = 20M
post_max_size = 24M
max_file_uploads = 6
; Los errores nunca se muestran al visitante: van al log.
display_errors = Off
log_errors = On
